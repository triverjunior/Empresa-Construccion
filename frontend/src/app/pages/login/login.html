<div class="login-container">
    <div class="login-card">
        <h2 class="login-title">Login</h2>
        <form (submit)="onSubmit($event)" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" [(ngModel)]="username" name="username" required class="form-control" />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" [(ngModel)]="password" name="password" required class="form-control" />
            </div>
            <div [ngClass]="{ 'error-message': !!errorMessage }">
                {{ errorMessage }}
            </div>
            <button type="submit" class="submit-btn" [disabled]="!username || !password">Sign In</button>
        </form>
    </div>
</div>
